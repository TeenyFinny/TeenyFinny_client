<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <title>개인정보 수집·이용 동의서</title>
    <style>
      body {
        font-family: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui,
          sans-serif;
        background-color: #fafcff;
        color: #222;
        font-size: 15px;
        line-height: 1.75;
        padding: 16px;
        word-break: keep-all;
      }
      h1,
      h2 {
        color: #0067ac;
        font-weight: 700;
      }
      h1 {
        font-size: 1.25rem;
        margin-bottom: 1rem;
      }
      h2 {
        font-size: 1rem;
        margin-top: 1.6rem;
      }
      ul {
        padding-left: 1.2rem;
      }
    </style>
  </head>
  <body>
    <h1>📄 [필수] 개인정보 수집·이용 동의서</h1>

    <h2>1. 수집 항목</h2>
    <ul>
      <li>회원 구분(부모/자녀), 이름, 생년월일, 휴대전화번호</li>
      <li>로그인 정보(ID, 비밀번호)</li>
      <li>계좌정보(은행명, 계좌번호)</li>
      <li>가족 인증 정보(가족관계증명서 또는 OTP코드)</li>
    </ul>

    <h2>2. 이용 목적</h2>
    <ul>
      <li>회원 식별 및 본인확인</li>
      <li>용돈 관리, 계좌 연동, 금융 퀴즈 제공</li>
      <li>서비스 개선 및 통계 분석</li>
      <li>부모–자녀 계정 연동 관리</li>
    </ul>

    <h2>3. 보유 및 이용 기간</h2>
    <p>회원 탈퇴 후 5년간 보관 (전자금융거래 기록 보존 법령에 의거)</p>
  </body>
</html>
