<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <title>전자금융거래 이용약관</title>
    <style>
      body {
        font-family: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui,
          sans-serif;
        background-color: #fafcff;
        color: #222;
        font-size: 15px;
        line-height: 1.75;
        padding: 16px;
        word-break: keep-all;
      }
      h1,
      h2 {
        color: #0067ac;
        font-weight: 700;
      }
      h1 {
        font-size: 1.25rem;
        margin-bottom: 1rem;
      }
      h2 {
        font-size: 1rem;
        margin-top: 1.6rem;
      }
    </style>
  </head>
  <body>
    <h1>📄 [필수] 전자금융거래 이용약관</h1>

    <h2>1. 적용 범위</h2>
    <p>
      이 약관은 회사가 제공하는 전자적 자금이체 및 금융거래 서비스에 적용됩니다.
    </p>

    <h2>2. 회원의 의무</h2>
    <p>
      회원은 비밀번호 및 인증수단을 제3자에게 양도 또는 노출해서는 안 됩니다.
    </p>

    <h2>3. 오류 정정 및 책임</h2>
    <p>
      회원은 거래 오류 발견 시 즉시 회사에 통보해야 하며, 회사는 법정 절차에
      따라 정정합니다.
    </p>

    <h2>4. 청소년 거래 제한</h2>
    <p>
      만 14세 미만 회원은 부모 승인 범위 내에서만 전자금융거래를 이용할 수
      있습니다.
    </p>
  </body>
</html>
